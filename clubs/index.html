<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><meta name="description" content="فهرست تمام تیم‌های پشتیبانی‌شده KICKORA"><title>تیم‌ها | KICKORA</title><link rel="stylesheet" href="../font.css"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="clubs.css"></head><body><header class="site-header"><a class="brand" href="../"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">KICKORA</span></a><nav class="main-nav"><a href="../">خانه</a><a class="active" href="./">تیم‌ها</a><a href="../#matches">بازی‌ها</a><a href="../#tables">جدول</a></nav></header><main class="clubs-page"><section class="clubs-hero"><div class="clubs-kicker">KICKORA / CLUBS</div><h1>تمام تیم‌ها</h1><p>تمام باشگاه‌هایی که در لیگ‌های متصل به KICKORA پشتیبانی می‌شوند؛ با جستجو، فیلتر لیگ و ورود مستقیم به پروفایل کامل هر تیم.</p></section><div class="clubs-toolbar"><input id="clubSearch" class="clubs-search" placeholder="جستجوی نام تیم..." autocomplete="off"><div id="clubFilters"></div><span id="clubCount" class="clubs-count"></span></div><div id="clubsGrid" class="clubs-grid"><div class="club-loading">در حال دریافت تیم‌ها...</div></div></main><script src="../clubs.js"></script><script>document.addEventListener('DOMContentLoaded',async()=>{const grid=document.querySelector('#clubsGrid'),count=document.querySelector('#clubCount'),filters=document.querySelector('#clubFilters');let clubs=[];try{clubs=await getClubs()}catch(e){grid.innerHTML='<div class="club-empty">دریافت تیم‌ها ناموفق بود.</div>';return}let active='all';filters.innerHTML='<button class="clubs-filter active" data-club-filter="all">همه</button>'+CLUB_LEAGUES.map(x=>`<button class="clubs-filter" data-club-filter="${x[0]}">${x[1]}</button>`).join('');const draw=()=>{const q=document.querySelector('#clubSearch').value.trim().toLowerCase();const list=clubs.filter(t=>(active==='all'||t.leagueCode===active)&&(!q||t.name.toLowerCase().includes(q)||faName(t.name).includes(q)));count.textContent=`${list.length} تیم`;grid.innerHTML=list.length?list.map(clubCard).join(''):'<div class="club-empty">تیمی پیدا نشد.</div>'};filters.addEventListener('click',e=>{const b=e.target.closest('[data-club-filter]');if(!b)return;active=b.dataset.clubFilter;document.querySelectorAll('[data-club-filter]').forEach(x=>x.classList.toggle('active',x===b));draw()});document.querySelector('#clubSearch').addEventListener('input',draw);grid.addEventListener('click',e=>{const b=e.target.closest('[data-club-id]');if(b)location.href=`team.html?id=${encodeURIComponent(b.dataset.clubId)}`});draw()});</script></body></html>
