<!doctype html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0f"><title>پروفایل تیم | KICKORA</title><link rel="stylesheet" href="../font.css"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="clubs.css"><style>body{min-height:100vh}.site-header{position:sticky;top:0;z-index:20}</style></head><body><header class="site-header"><a class="brand" href="../"><span class="brand-mark" aria-hidden="true"></span><span class="brand-word">KICKORA</span></a><nav class="main-nav"><a href="../">خانه</a><a class="active" href="./">تیم‌ها</a><a href="../#matches">بازی‌ها</a><a href="../#tables">جدول</a></nav></header><main class="club-profile"><a class="club-back" href="./">← بازگشت به همه تیم‌ها</a><div id="profile"><div class="club-loading">در حال دریافت پروفایل تیم...</div></div></main><footer><div class="footer-brand"><strong>KICKORA</strong></div><p>Football, upgraded.</p></footer><script src="../clubs.js"></script><script>const id=new URLSearchParams(location.search).get('id');const API='/api/football';const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const fa=n=>window.FA_TEAM_NAMES?.[n]||n;const fmt=d=>{try{return new Intl.DateTimeFormat('fa-IR',{dateStyle:'medium'}).format(new Date(d))}catch{return''}};async function get(u){const r=await fetch(u);const d=await r.json();if(!r.ok||d.ok===false)throw Error(d.error||'API error');return d}async function render(){if(!id){document.querySelector('#profile').innerHTML='<div class="club-empty">شناسه تیم پیدا نشد.</div>';return}try{const d=await get(`${API}/team?id=${encodeURIComponent(id)}`);const t=d.team||{};const squad=(d.squad||[]).slice(0,16);const fixtures=d.fixtures||[];const stat=d.statistics||{};document.title=`${fa(t.name)} | KICKORA`;document.querySelector('#profile').innerHTML=`<section class="club-cover"><img class="club-cover-logo" src="${esc(t.logo||'')}" alt="${esc(fa(t.name))}"><div><div class="clubs-kicker">CLUB PROFILE</div><h1>${esc(fa(t.name))}</h1><div class="en">${esc(t.name||'')}</div><div class="club-meta"><span>کشور: ${esc(t.country||'—')}</span><span>تأسیس: ${esc(t.founded||'—')}</span><span>استادیوم: ${esc(t.venue?.name||'—')}</span><span>ظرفیت: ${esc(t.venue?.capacity||'—')}</span></div></div></section><div class="club-layout"><div><section class="club-panel"><h2>بیوگرافی و معرفی</h2><p class="club-bio">${esc(fa(t.name))} یک باشگاه فوتبال از ${esc(t.country||'کشور نامشخص')} است که طبق داده‌های KICKORA در سال ${esc(t.founded||'نامشخص')} تأسیس شده است. این صفحه پروفایل مرکزی باشگاه است و اطلاعات هویتی، ورزشگاه، وضعیت فصل، ترکیب بازیکنان و برنامه مسابقات را از داده‌های زنده API دریافت می‌کند.</p></section><section class="club-panel"><h2>آمار فصل</h2><div class="club-stats"><div class="club-stat"><b>${esc(stat.games?.played?.total??'—')}</b><small>بازی</small></div><div class="club-stat"><b>${esc(stat.goals?.for?.total?.total??'—')}</b><small>گل زده</small></div><div class="club-stat"><b>${esc(stat.goals?.against?.total?.total??'—')}</b><small>گل خورده</small></div></div></section><section class="club-panel"><h2>ترکیب تیم</h2><div class="squad-grid">${squad.length?squad.map(p=>`<div class="player-card"><img src="${esc(p.photo||'')}" alt="" loading="lazy"><strong>${esc(p.name)}</strong><small>${esc(p.position||'بازیکن')}</small></div>`).join(''):'<div class="club-empty">ترکیب فعلاً در دسترس نیست.</div>'}</div></section></div><aside><section class="club-panel"><h2>ورزشگاه</h2><p class="club-bio">${esc(t.venue?.name||'—')}<br>${esc(t.venue?.city||'')} ${t.venue?.capacity?` · ظرفیت ${esc(t.venue.capacity)}`:''}</p></section><section class="club-panel"><h2>بازی‌های اخیر و پیش‌رو</h2>${fixtures.length?fixtures.slice(0,8).map(f=>`<div class="fixture-mini"><div class="fixture-side"><img src="${esc(f.home?.logo||'')}" alt=""><span>${esc(f.home?.name||'')}</span></div><b class="fixture-score">${f.status==='NS'?'—':`${f.goals?.home??0} - ${f.goals?.away??0}`}</b><div class="fixture-side"><span>${esc(f.away?.name||'')}</span><img src="${esc(f.away?.logo||'')}" alt=""></div></div>`).join(''):'<div class="club-empty">مسابقه‌ای در دسترس نیست.</div>'}</section></aside></div>`}catch(e){console.error(e);document.querySelector('#profile').innerHTML=`<div class="club-empty">پروفایل تیم فعلاً قابل دریافت نیست.<br><small>${esc(e.message)}</small></div>`}}render();</script></body></html>
