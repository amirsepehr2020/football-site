name: Validate KICKORAX
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check active JavaScript syntax
        run: |
          node --check app-fixed.js
          node --check functions/api/football.js
          node --check live-refresh.js
          node --check news-translate.js
          node --check pwa.js
      - name: Check required files
        run: |
          test -f index.html
          test -f styles.css
          test -f brand.css
          test -f font.css
          test -f app-fixed.js
          test -f functions/api/football.js
          test -f manifest.webmanifest
